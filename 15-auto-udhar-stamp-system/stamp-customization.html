<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stamp Customization</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Stamp Settings</div>
    <div class="menu">
      <a href="udhar-stamp.html">🧾 Udhar Stamp</a>
      <a class="active">⚙ Stamp Customization</a>
      <a href="days-stamp-system.html">⏳ Days Stamp</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Stamp Customization</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Stamp Text</label>
        <input id="stampText" value="UDHAR BILL">
      </div>

      <div class="form-group">
        <label>Stamp Color</label>
        <select id="stampColor">
          <option>Red</option>
          <option>Blue</option>
          <option>Green</option>
          <option>Black</option>
        </select>
      </div>

      <div class="form-group">
        <label>Show Due Days On Stamp?</label>
        <select>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="previewStamp()">Preview Stamp</button>

      <div style="margin-top:25px;">
        <span class="stamp" id="preview">UDHAR BILL</span>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function previewStamp(){
  const text = document.getElementById("stampText").value;
  document.getElementById("preview").innerText = text || "UDHAR BILL";
}
</script>
</body>
</html>

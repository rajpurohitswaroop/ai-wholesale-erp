<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7/10/15 Days Stamp System</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Days Stamp</div>
    <div class="menu">
      <a href="udhar-stamp.html">🧾 Udhar Stamp</a>
      <a class="active">⏳ Days Stamp</a>
      <a href="due-date-system.html">📅 Due Date</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>7 / 10 / 15 Days Stamp System</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>7 Days</h3><h2>Fast Due</h2></div>
      <div class="card stat"><h3>10 Days</h3><h2>Normal Due</h2></div>
      <div class="card stat"><h3>15 Days</h3><h2>Long Due</h2></div>
      <div class="card stat"><h3>Custom</h3><h2>Owner Set</h2></div>
    </div>

    <div class="card">
      <h2>Select Stamp Type</h2>
      <div class="form-group">
        <label>Default Udhar Stamp Days</label>
        <select id="days">
          <option>7 Days</option>
          <option>10 Days</option>
          <option>15 Days</option>
          <option>Custom</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Days stamp setting saved ✅')">Save Days Stamp</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

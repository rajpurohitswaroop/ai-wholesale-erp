<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Customization</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Bill Settings</div>
    <div class="menu">
      <a href="auto-bill-generation.html">🧾 Auto Bill</a>
      <a class="active">⚙ Customization</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Bill Customization</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Business Name</label>
        <input placeholder="Enter business name">
      </div>

      <div class="form-group">
        <label>GST Number</label>
        <input placeholder="Enter GST number">
      </div>

      <div class="form-group">
        <label>Bill Footer Note</label>
        <input placeholder="Thank you for business">
      </div>

      <button class="btn btn-primary" onclick="alert('Bill settings saved ✅')">Save Settings</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

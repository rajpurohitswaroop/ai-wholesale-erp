<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Invoice</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">PDF Invoice</div>
    <div class="menu">
      <a href="auto-bill-generation.html">🧾 Auto Bill</a>
      <a class="active">📄 PDF Invoice</a>
      <a href="print-bill.html">🖨 Print Bill</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>PDF Invoice Preview</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="invoice-box">
      <div class="invoice-title">AI Wholesale ERP Invoice</div>
      <p style="color:var(--muted);margin:8px 0;">Invoice No: INV-1001 | Date: Today</p>

      <br>

      <table>
        <tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr>
        <tr><td>Sugar</td><td>10</td><td>₹42</td><td>₹420</td></tr>
        <tr><td>Oil Tin</td><td>5</td><td>₹1250</td><td>₹6250</td></tr>
      </table>

      <br>
      <h2>Total: ₹6670</h2>
      <br>
      <span class="stamp">CASH RECEIVED</span>
    </div>

    <br>
    <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

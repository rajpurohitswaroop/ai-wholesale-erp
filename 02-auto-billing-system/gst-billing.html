<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GST Billing</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">GST Billing</div>
    <div class="menu">
      <a href="auto-bill-generation.html">🧾 Auto Bill</a>
      <a class="active">📊 GST Billing</a>
      <a href="pdf-invoice.html">📄 PDF Invoice</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>GST Billing Calculator</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Amount</label>
        <input id="amount" type="number" placeholder="Enter amount">
      </div>

      <div class="form-group">
        <label>GST %</label>
        <input id="gst" type="number" placeholder="Enter GST %">
      </div>

      <button class="btn btn-primary" onclick="calculateGST()">Calculate GST</button>

      <h2 id="gstResult" style="margin-top:20px;color:var(--primary-dark);"></h2>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function calculateGST(){
  const amount = Number(document.getElementById("amount").value);
  const gst = Number(document.getElementById("gst").value);

  if(amount <= 0 || gst < 0){
    alert("Amount aur GST sahi bharein");
    return;
  }

  const gstAmount = amount * gst / 100;
  const total = amount + gstAmount;

  document.getElementById("gstResult").innerText =
    `GST: ₹${gstAmount.toFixed(2)} | Total: ₹${total.toFixed(2)}`;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Bill Generation</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Billing</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">🧾 Auto Bill</a>
      <a href="gst-billing.html">📊 GST Billing</a>
      <a href="invoice-history.html">📜 Invoice History</a>
      <a href="payment-status.html">💳 Payment Status</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Auto Bill Generation</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="billing-layout">
      <div class="card">
        <h2>Create Bill</h2>

        <div class="form-group">
          <label>Product Name</label>
          <input id="itemName" placeholder="Example: Sugar">
        </div>

        <div class="form-group">
          <label>Quantity</label>
          <input id="itemQty" type="number" placeholder="Example: 10">
        </div>

        <div class="form-group">
          <label>Rate</label>
          <input id="itemRate" type="number" placeholder="Example: 42">
        </div>

        <div class="form-group">
          <label>GST %</label>
          <input id="itemGst" type="number" placeholder="Example: 5">
        </div>

        <button class="btn btn-primary" onclick="addItem()">Add Item</button>

        <br><br>

        <table>
          <thead>
            <tr><th>#</th><th>Product</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr>
          </thead>
          <tbody id="billItems"></tbody>
        </table>
      </div>

      <div class="card bill-summary">
        <h2>Bill Summary</h2>
        <div class="summary-row"><span>Total Amount</span><strong id="billTotal">₹0.00</strong></div>
        <div class="summary-total">Payment</div>

        <div class="payment-options">
          <div class="payment-option" onclick="selectPayment('cash')">Cash</div>
          <div class="payment-option" onclick="selectPayment('upi')">UPI</div>
          <div class="payment-option" onclick="selectPayment('pending')">Pending</div>
        </div>

        <p id="paymentStatus" style="margin-top:18px;font-weight:900;color:var(--primary-dark);">
          STATUS: NOT SELECTED
        </p>

        <button class="btn btn-primary full-btn" onclick="alert('Bill generated successfully ✅')">
          Generate Bill
        </button>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/billing.js"></script>
<script src="../../assets/js/payment.js"></script>
<script>
function addItem(){
  const name = document.getElementById("itemName").value.trim();
  const qty = Number(document.getElementById("itemQty").value);
  const rate = Number(document.getElementById("itemRate").value);
  const gst = Number(document.getElementById("itemGst").value || 0);
  addBillItem(name, qty, rate, gst);
}
</script>
</body>
</html>

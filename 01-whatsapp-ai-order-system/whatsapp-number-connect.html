<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Number Connect</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">

<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar"><div class="brand">Number Connect</div><div class="menu"><a href="whatsapp-order-system.html">📲 Orders</a><a class="active">🔗 Connect Number</a></div></aside>

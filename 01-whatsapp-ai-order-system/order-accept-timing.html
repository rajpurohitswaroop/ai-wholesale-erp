<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Accept Timing</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.container{
    width:90%;
    margin:auto;
    padding:30px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:30px;
    margin-top:25px;
}

h1{
    color:#38bdf8;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

input,select{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:10px;
    margin-top:20px;
    cursor:pointer;
}

.status{
    margin-top:20px;
    color:#4ade80;
}

</style>

</head>

<body>

<div class="container">

    <h1>Order Accept Timing</h1>

    <div class="card">

        <div class="row">

            <div>
                <label>Start Order Time</label>
                <input type="time" id="startTime">
            </div>

            <div>
                <label>Stop Order Time</label>
                <input type="time" id="endTime">
            </div>

            <div>
                <label>Accept Sunday Orders</label>

                <select id="sunday">
                    <option>YES</option>
                    <option>NO</option>
                </select>
            </div>

            <div>
                <label>Night Orders</label>

                <select id="night">
                    <option>Enabled</option>
                    <option>Disabled</option>
                </select>
            </div>

        </div>

        <button onclick="saveOrderTiming()">
            Save Timing
        </button>

        <div class="status" id="result"></div>

    </div>

</div>

<script>

function saveOrderTiming(){

    let start = document.getElementById("startTime").value;
    let end = document.getElementById("endTime").value;

    document.getElementById("result").innerHTML =
    "Order Timing Saved : " + start + " To " + end;

}

</script>

</body>
</html>

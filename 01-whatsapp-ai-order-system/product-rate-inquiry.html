<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Rate Inquiry</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar"><div class="brand">Rate Inquiry</div><div class="menu"><a href="whatsapp-order-system.html">📲 Orders</a><a class="active">💰 Product Rate</a></div></aside>
  <main class="main">
    <div class="topbar"><h1>Product Rate Inquiry</h1><button class="btn btn-light" onclick="logout()">Logout</button></div>
    <div class="card">
      <h2>AI Rate Reply Demo</h2>
      <div class="form-group"><label>Customer Message</label><input id="rateMsg" placeholder="Example: sugar ka rate kya hai?"></div>
      <button class="btn btn-primary" onclick="checkRate()">Generate Reply</button>
      <p id="rateReply" style="margin-top:18px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
<script>
function checkRate(){
  const msg=document.getElementById("rateMsg").value;
  document.getElementById("rateReply").innerText = msg ? "AI Reply: Sugar rate ₹42/kg hai. Stock available hai ✅" : "Message enter karo";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer-wise Pricing</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Rate System</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">👤 Customer-wise Pricing</a>
      <a href="custom-product-rates.html">📦 Custom Rates</a>
      <a href="bulk-rate-updates.html">📥 Bulk Rates</a>
      <a href="rate-settings-panel.html">⚙ Rate Settings</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Customer-wise Pricing</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Set Customer Special Rate</h2>

      <div class="form-group">
        <label>Customer Name</label>
        <input id="customerName" placeholder="Example: Ram Kirana">
      </div>

      <div class="form-group">
        <label>Product Name</label>
        <input id="productName" placeholder="Example: Sugar">
      </div>

      <div class="form-group">
        <label>Special Rate</label>
        <input id="specialRate" type="number" placeholder="Example: 40">
      </div>

      <button class="btn btn-primary" onclick="saveCustomerRate()">Save Customer Rate</button>
      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveCustomerRate(){
  const c = document.getElementById("customerName").value.trim();
  const p = document.getElementById("productName").value.trim();
  const r = document.getElementById("specialRate").value;

  if(!c || !p || !r){
    alert("Customer, product aur rate fill karo");
    return;
  }

  document.getElementById("result").innerText = `${c} ke liye ${p} ka special rate ₹${r} saved ✅`;
}
</script>
</body>
</html>

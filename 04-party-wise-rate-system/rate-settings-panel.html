<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings Panel</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Rate Settings</div>
    <div class="menu">
      <a href="customer-wise-pricing.html">👤 Customer Rate</a>
      <a href="bulk-rate-updates.html">📥 Bulk Update</a>
      <a class="active">⚙ Rate Settings</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Rate Settings Panel</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Owner Rate Controls</h2>

      <div class="form-group">
        <label>Allow Staff to Edit Rates</label>
        <select>
          <option>No</option>
          <option>Yes</option>
        </select>
      </div>

      <div class="form-group">
        <label>Minimum Profit Margin %</label>
        <input type="number" placeholder="Example: 10">
      </div>

      <div class="form-group">
        <label>Rate Change Approval</label>
        <select>
          <option>Owner Approval Required</option>
          <option>Auto Approve</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Rate settings saved ✅')">Save Settings</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

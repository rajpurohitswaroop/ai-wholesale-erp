<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Update Permissions</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Stock Permission</div>
    <div class="menu">
      <a href="staff-permissions.html">🔐 Staff Permissions</a>
      <a href="product-management-permissions.html">📦 Product Permission</a>
      <a class="active">📊 Stock Update</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Stock Update Permissions</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Staff Stock Access</h2>

      <div class="form-group">
        <label>Allow Staff Stock Update?</label>
        <select>
          <option>Yes, With Owner Permission</option>
          <option>No</option>
          <option>Only Add Stock</option>
          <option>Add + Remove Stock</option>
        </select>
      </div>

      <div class="form-group">
        <label>Daily Stock Edit Limit</label>
        <input type="number" placeholder="Example: 20">
      </div>

      <button class="btn btn-primary" onclick="alert('Stock permission saved ✅')">Save Permission</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

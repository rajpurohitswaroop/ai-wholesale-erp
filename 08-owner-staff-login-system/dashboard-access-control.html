<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Access Control</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Access Control</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a href="role-management.html">👥 Roles</a>
      <a class="active">📊 Dashboard Access</a>
      <a href="staff-permissions.html">🔐 Permissions</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Dashboard Access Control</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card table-card">
      <table>
        <tr><th>Dashboard Section</th><th>Owner</th><th>Staff</th></tr>
        <tr><td>Sales Dashboard</td><td><span class="status paid">Allowed</span></td><td><span class="status paid">Allowed</span></td></tr>
        <tr><td>Billing Dashboard</td><td><span class="status paid">Allowed</span></td><td><span class="status paid">Allowed</span></td></tr>
        <tr><td>Owner Settings</td><td><span class="status paid">Allowed</span></td><td><span class="status danger">Blocked</span></td></tr>
        <tr><td>Staff Permissions</td><td><span class="status paid">Allowed</span></td><td><span class="status danger">Blocked</span></td></tr>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Recommendations</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard(); showAISuggestion('business')">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">AI Suggestions</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">🤖 Smart Recommendations</a>
      <a href="ai-reorder-alerts.html">📦 Reorder Alerts</a>
      <a href="business-insights.html">📊 Business Insights</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Smart Recommendations</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Best Action</h3><h2>Reorder</h2></div>
      <div class="card stat"><h3>Risk</h3><h2>Low Stock</h2></div>
      <div class="card stat"><h3>Opportunity</h3><h2>VIP Sale</h2></div>
      <div class="card stat"><h3>AI Score</h3><h2>92%</h2></div>
    </div>

    <div class="card">
      <h2>AI Recommendation</h2>
      <p id="aiSuggestion" style="margin-top:12px;color:var(--primary-dark);font-weight:800;">
        Loading AI recommendation...
      </p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/ai.js"></script>
</body>
</html>

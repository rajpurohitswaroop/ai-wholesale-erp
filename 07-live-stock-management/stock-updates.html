<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Updates</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Stock Updates</div>
    <div class="menu">
      <a href="live-stock-tracking.html">📦 Live Stock</a>
      <a class="active">🔄 Stock Updates</a>
      <a href="stock-history.html">📜 History</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Stock Updates</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Update Product Stock</h2>

      <div class="form-group">
        <label>Product Name</label>
        <input id="productName" placeholder="Example: Sugar">
      </div>

      <div class="form-group">
        <label>Update Type</label>
        <select id="updateType">
          <option>Add Stock</option>
          <option>Remove Stock</option>
          <option>Damage Stock</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <input id="qty" type="number" placeholder="Example: 50">
      </div>

      <button class="btn btn-primary" onclick="saveStockUpdate()">Update Stock</button>
      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveStockUpdate(){
  const product = document.getElementById("productName").value.trim();
  const qty = document.getElementById("qty").value;

  if(!product || !qty){
    alert("Product aur quantity fill karo");
    return;
  }

  document.getElementById("result").innerText = "Stock updated successfully ✅";
}
</script>
</body>
</html>

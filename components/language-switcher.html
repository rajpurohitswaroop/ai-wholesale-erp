<div class="card">
  <h2>Language Switcher</h2>
  <p style="color:var(--muted);margin:8px 0 16px;">Owner apni preferred language select kar sakta hai.</p>

  <div class="language-panel">
    <div class="language-card active" onclick="changeLanguage('hi')">
      <h3>हिंदी</h3>
      <p>Hindi Dashboard</p>
    </div>

    <div class="language-card" onclick="changeLanguage('en')">
      <h3>English</h3>
      <p>English Dashboard</p>
    </div>

    <div class="language-card" onclick="changeLanguage('gu')">
      <h3>ગુજરાતી</h3>
      <p>Gujarati Dashboard</p>
    </div>
  </div>
</div>

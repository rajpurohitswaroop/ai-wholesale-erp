<div class="card">
  <h2>Modal Preview</h2>

  <button class="btn btn-primary" onclick="document.getElementById('demoModal').style.display='flex'">
    Open Modal
  </button>

  <div id="demoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;">
    <div class="card" style="width:420px;">
      <h2>Confirm Action</h2>
      <p style="color:var(--muted);margin:14px 0;">Are you sure you want to continue?</p>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-light" onclick="document.getElementById('demoModal').style.display='none'">Cancel</button>
        <button class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Limit Notifications</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Notifications</div>
    <div class="menu">
      <a href="customer-credit-alerts.html">👤 Credit Alerts</a>
      <a href="auto-order-block-warning.html">🚫 Order Block</a>
      <a class="active">🔔 Notifications</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Credit Limit Notifications</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card table-card">
      <table>
        <tr><th>Notification</th><th>To</th><th>Status</th></tr>
        <tr><td>Credit 80% used</td><td>Owner</td><td><span class="status paid">Enabled</span></td></tr>
        <tr><td>Limit crossed</td><td>Owner + Customer</td><td><span class="status paid">Enabled</span></td></tr>
        <tr><td>Order blocked</td><td>Customer</td><td><span class="status pending">Auto Message</span></td></tr>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

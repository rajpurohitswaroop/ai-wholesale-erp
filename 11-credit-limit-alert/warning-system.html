<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Warning System</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Warning</div>
    <div class="menu">
      <a href="customer-credit-alerts.html">👤 Credit Alerts</a>
      <a class="active">⚠ Warning System</a>
      <a href="pending-limit-alerts.html">⏳ Pending Limit</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Warning System</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Credit Warning Settings</h2>

      <div class="form-group">
        <label>Warning Level</label>
        <select>
          <option>80% Credit Used</option>
          <option>90% Credit Used</option>
          <option>100% Limit Crossed</option>
        </select>
      </div>

      <div class="form-group">
        <label>Warning Message</label>
        <textarea rows="5">Customer credit limit ke near hai. Payment request karein.</textarea>
      </div>

      <button class="btn btn-primary" onclick="alert('Warning settings saved ✅')">Save Warning</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

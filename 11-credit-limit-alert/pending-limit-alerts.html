<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Limit Alerts</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Pending Limit</div>
    <div class="menu">
      <a href="customer-credit-alerts.html">👤 Credit Alerts</a>
      <a href="warning-system.html">⚠ Warning</a>
      <a class="active">⏳ Pending Limit Alerts</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Pending Limit Alerts</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Near Limit</h3><h2>12</h2></div>
      <div class="card stat"><h3>Limit Crossed</h3><h2>5</h2></div>
      <div class="card stat"><h3>Blocked Orders</h3><h2>3</h2></div>
      <div class="card stat"><h3>Safe Customers</h3><h2>80</h2></div>
    </div>

    <div class="card">
      <h2>Alert Rule</h2>
      <p style="color:var(--muted);line-height:1.8;margin-top:10px;">
        Customer ka pending amount credit limit ke paas pahunchte hi owner ko alert milega.
      </p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Receipt Generation</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Receipt System</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">🧾 Auto Receipt</a>
      <a href="whatsapp-receipts.html">📲 WhatsApp Receipt</a>
      <a href="receipt-history.html">📜 Receipt History</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Auto Receipt Generation</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="invoice-box">
      <div class="invoice-title">Payment Receipt</div>
      <p>Receipt No: RCP-1001</p>
      <p>Customer: Ram Kirana</p>
      <p>Amount Received: ₹6,670</p>
      <p>Payment Mode: UPI</p>
      <p>Date: Today</p>
      <br>
      <span class="stamp">PAYMENT RECEIVED</span>
    </div>

    <br>
    <button class="btn btn-primary" onclick="alert('Auto receipt generated ✅')">Generate Receipt</button>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export PDF Excel</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Export</div>
    <div class="menu">
      <a href="daily-reports.html">📅 Reports</a>
      <a class="active">📤 Export PDF/Excel</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Export Reports PDF / Excel</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Export Options</h2>

      <div class="form-group">
        <label>Select Report</label>
        <select id="reportType">
          <option>Daily Report</option>
          <option>Monthly Report</option>
          <option>Yearly Report</option>
          <option>Profit Report</option>
          <option>Pending Payment Report</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="exportReport('PDF')">Export PDF</button>
      <button class="btn btn-light" onclick="exportReport('Excel')">Export Excel</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/reports.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Reports</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/reports.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Monthly</div>
    <div class="menu">
      <a href="daily-reports.html">📅 Daily Reports</a>
      <a class="active">🗓 Monthly Reports</a>
      <a href="yearly-reports.html">📆 Yearly Reports</a>
      <a href="profit-reports.html">💰 Profit Reports</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Monthly Reports</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Monthly Revenue</h3><h2>₹9,80,000</h2></div>
      <div class="card stat"><h3>Total Orders</h3><h2>1,240</h2></div>
      <div class="card stat"><h3>Total Pending</h3><h2>₹1,45,200</h2></div>
      <div class="card stat"><h3>Expenses</h3><h2>₹48,000</h2></div>
    </div>

    <div class="card">
      <h2>Monthly Report Actions</h2>
      <button class="btn btn-primary" onclick="generateMonthlyReport()">Generate Monthly Report</button>
      <button class="btn btn-light" onclick="exportReport('Monthly')">Export Report</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/reports.js"></script>
</body>
</html>

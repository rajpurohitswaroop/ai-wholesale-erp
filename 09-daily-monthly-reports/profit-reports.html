<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Reports</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/reports.css">
</head>
<body onload="loadDashboard()">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Profit</div>
    <div class="menu">
      <a href="daily-reports.html">📅 Reports</a>
      <a class="active">💰 Profit Reports</a>
      <a href="sales-reports.html">📈 Sales</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Profit Reports</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Gross Profit</h3><h2>₹1,25,000</h2></div>
      <div class="card stat"><h3>Net Profit</h3><h2>₹88,000</h2></div>
      <div class="card stat"><h3>Profit Margin</h3><h2>14%</h2></div>
      <div class="card stat"><h3>Expenses</h3><h2>₹37,000</h2></div>
    </div>

    <div class="card table-card">
      <h2>Product-wise Profit</h2>
      <table>
        <tr><th>Product</th><th>Sales</th><th>Profit</th></tr>
        <tr><td>Sugar</td><td>₹2,40,000</td><td>₹28,000</td></tr>
        <tr><td>Oil Tin</td><td>₹3,10,000</td><td>₹42,000</td></tr>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/reports.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text AI</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Speech AI</div>
    <div class="menu">
      <a href="whatsapp-voice-orders.html">🎙 Voice Orders</a>
      <a class="active">📝 Speech to Text</a>
      <a href="product-detection.html">📦 Product Detection</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Speech-to-Text AI</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Voice Text Output</h2>

      <div class="form-group">
        <label>Voice Converted Text</label>
        <textarea id="voiceText" rows="5">10 कट्टे sugar 5 oil tin</textarea>
      </div>

      <button class="btn btn-primary" onclick="convertText()">Process Text</button>

      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function convertText(){
  const text = document.getElementById("voiceText").value.trim();
  if(!text){
    alert("Voice text empty hai");
    return;
  }
  document.getElementById("result").innerText = "Speech text processed successfully ✅";
}
</script>
</body>
</html>

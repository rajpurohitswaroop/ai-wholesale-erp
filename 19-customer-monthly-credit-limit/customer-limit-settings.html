<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Limit Settings</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Limit Settings</div>
    <div class="menu">
      <a href="monthly-udhar-limit.html">💳 Monthly Limit</a>
      <a class="active">⚙ Customer Limit Settings</a>
      <a href="enable-disable-option.html">🔘 Enable/Disable</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Customer Limit Settings</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Default Monthly Limit</label>
        <input type="number" placeholder="Example: 50000">
      </div>

      <div class="form-group">
        <label>Limit Cross Action</label>
        <select>
          <option>Block Order</option>
          <option>Owner Approval Required</option>
          <option>Warning Only</option>
        </select>
      </div>

      <div class="form-group">
        <label>Warning Before Limit</label>
        <select>
          <option>80%</option>
          <option>90%</option>
          <option>95%</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Customer limit settings saved ✅')">Save Settings</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

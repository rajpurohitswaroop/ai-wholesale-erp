<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enable Disable Credit Limit</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Limit Control</div>
    <div class="menu">
      <a href="customer-limit-settings.html">⚙ Settings</a>
      <a class="active">🔘 Enable / Disable</a>
      <a href="customer-wise-monthly-control.html">👤 Customer Control</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Enable / Disable Credit Limit</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Monthly Credit Limit System</label>
        <select id="limitStatus">
          <option>Enabled</option>
          <option>Disabled</option>
        </select>
      </div>

      <div class="form-group">
        <label>Apply For</label>
        <select>
          <option>All Customers</option>
          <option>Only Selected Customers</option>
          <option>Only New Customers</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="saveStatus()">Save Status</button>
      <p id="msg" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveStatus(){
  const status = document.getElementById("limitStatus").value;
  document.getElementById("msg").innerText = "Monthly credit limit system: " + status + " ✅";
}
</script>
</body>
</html>

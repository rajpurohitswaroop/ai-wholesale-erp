<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Wholesale ERP | Dashboard Layout</title>

  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand">AI Wholesale ERP</div>

      <div class="menu">
        <a class="active">🏠 Dashboard</a>
        <a>📦 Products</a>
        <a>🧾 Billing</a>
        <a>📒 Khata</a>
        <a>📲 WhatsApp AI</a>
        <a>📊 Reports</a>
        <a>⚙ Settings</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Dashboard Layout</h1>
          <p style="color: var(--muted); margin-top: 4px;">Common layout for ERP pages</p>
        </div>

        <button class="btn btn-light">Logout</button>
      </div>

      <div class="grid">
        <div class="card stat"><h3>Today Sales</h3><h2>₹1,20,500</h2></div>
        <div class="card stat"><h3>Pending</h3><h2>₹45,200</h2></div>
        <div class="card stat"><h3>Orders</h3><h2>58</h2></div>
        <div class="card stat"><h3>Low Stock</h3><h2>12</h2></div>
      </div>
    </main>
  </div>

</body>
</html>

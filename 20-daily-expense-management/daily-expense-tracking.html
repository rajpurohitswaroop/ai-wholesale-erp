<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Expense Tracking</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Daily Expense</div>
    <div class="menu">
      <a href="staff-expense-entry.html">➕ Entry</a>
      <a class="active">📊 Daily Tracking</a>
      <a href="monthly-expense-reports.html">🗓 Monthly Report</a>

  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Daily Expense Tracking</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Today Expense</h3><h2>₹2,450</h2></div>
      <div class="card stat"><h3>Tea</h3><h2>₹350</h2></div>
      <div class="card stat"><h3>Transport</h3><h2>₹1,200</h2></div>
      <div class="card stat"><h3>Loading</h3><h2>₹900</h2></div>
    </div>

    <div class="card table-card">
      <table>
        <tr><th>Time</th><th>Type</th><th>Amount</th><th>Staff</th></tr>
        <tr><td>10:15 AM</td><td>Tea</td><td>₹350</td><td>Ramesh</td></tr>
        <tr><td>12:40 PM</td><td>Transport</td><td>₹1,200</td><td>Suresh</td></tr>
      </table>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>

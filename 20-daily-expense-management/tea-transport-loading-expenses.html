<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Transport Loading Expenses</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Expense Types</div>
    <div class="menu">
      <a href="staff-expense-entry.html">➕ Entry</a>
      <a class="active">☕ Tea / Transport / Loading</a>
      <a href="expense-history.html">📜 History</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Tea / Transport / Loading Expenses</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Tea Expense</h3><h2>₹350</h2></div>
      <div class="card stat"><h3>Transport</h3><h2>₹1,200</h2></div>
      <div class="card stat"><h3>Loading</h3><h2>₹900</h2></div>
      <div class="card stat"><h3>Total</h3><h2>₹2,450</h2></div>
    </div>

    <div class="card">
      <h2>Quick Add</h2>
      <button class="btn btn-primary" onclick="alert('Tea expense added ✅')">Add Tea ₹50</button>
      <button class="btn btn-light" onclick="alert('Loading expense added ✅')">Add Loading ₹500</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

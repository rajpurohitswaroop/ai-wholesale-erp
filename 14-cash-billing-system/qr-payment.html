<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Payment</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">QR Payment</div>
    <div class="menu">
      <a href="quick-billing.html">⚡ Quick Billing</a>
      <a class="active">🔳 QR Payment</a>
      <a href="upi-payment.html">📲 UPI Payment</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>QR Payment</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Scan QR to Pay</h2>
      <div style="width:220px;height:220px;border:2px dashed var(--primary);border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:900;margin-top:20px;">
        UPI QR
      </div>
      <p style="color:var(--muted);margin-top:15px;">Payment scan hone ke baad status update hoga.</p>
      <button class="btn btn-primary" onclick="alert('QR payment marked received ✅')">Mark Received</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

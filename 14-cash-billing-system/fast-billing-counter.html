<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Billing Counter</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Billing Counter</div>
    <div class="menu">
      <a href="quick-billing.html">⚡ Quick Billing</a>
      <a class="active">🏪 Fast Counter</a>
      <a href="cash-payment.html">💵 Cash</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Fast Billing Counter System</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Today Bills</h3><h2>58</h2></div>
      <div class="card stat"><h3>Cash Sale</h3><h2>₹35,000</h2></div>
      <div class="card stat"><h3>UPI Sale</h3><h2>₹22,500</h2></div>
      <div class="card stat"><h3>Pending</h3><h2>₹18,400</h2></div>
    </div>

    <div class="card">
      <h2>Counter Actions</h2>
      <a class="btn btn-primary" href="quick-billing.html">New Quick Bill</a>
      <a class="btn btn-light" href="cash-payment.html">Cash Payment</a>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

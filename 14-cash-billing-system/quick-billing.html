<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Billing</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Cash Billing</div>
    <div class="menu">
      <a class="active">⚡ Quick Billing</a>
      <a href="cash-payment.html">💵 Cash Payment</a>
      <a href="upi-payment.html">📲 UPI Payment</a>
      <a href="qr-payment.html">🔳 QR Payment</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Quick Billing</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="billing-layout">
      <div class="card">
        <h2>Add Item</h2>
        <div class="form-group"><label>Product</label><input id="itemName" placeholder="Sugar"></div>
        <div class="form-group"><label>Qty</label><input id="itemQty" type="number" placeholder="10"></div>
        <div class="form-group"><label>Rate</label><input id="itemRate" type="number" placeholder="42"></div>
        <button class="btn btn-primary" onclick="addItem()">Add Item</button>

        <br><br>
        <table>
          <thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr></thead>
          <tbody id="billItems"></tbody>
        </table>
      </div>

      <div class="card bill-summary">
        <h2>Cash Bill</h2>
        <div class="summary-total" id="billTotal">₹0.00</div>
        <button class="btn btn-primary full-btn" onclick="alert('Quick bill generated ✅')">Generate Cash Bill</button>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/billing.js"></script>
<script>
function addItem(){
  addBillItem(
    document.getElementById("itemName").value.trim(),
    Number(document.getElementById("itemQty").value),
    Number(document.getElementById("itemRate").value),
    5
  );
}
</script>
</body>
</html>

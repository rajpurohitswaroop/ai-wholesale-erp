<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">UPI Payment</div>
    <div class="menu">
      <a href="cash-payment.html">💵 Cash</a>
      <a href="qr-payment.html">🔳 QR</a>
      <a class="active">📲 UPI Payment</a>
      <a href="payment-status-tracking.html">📊 Status</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>UPI Payment</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group"><label>UPI ID</label><input id="upi" placeholder="business@upi"></div>
      <div class="form-group"><label>Amount</label><input id="amount" type="number" placeholder="6670"></div>
      <div class="form-group"><label>Transaction ID</label><input id="txn" placeholder="UPI123456"></div>
      <button class="btn btn-primary" onclick="alert('UPI payment saved ✅')">Save UPI Payment</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

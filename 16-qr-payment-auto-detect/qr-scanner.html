<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">QR Payment</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">🔳 QR Scanner</a>
      <a href="auto-payment-detect.html">🤖 Auto Detect</a>
      <a href="payment-confirmation.html">✅ Confirmation</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>QR Scanner</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Scan Customer Payment QR</h2>
      <div style="width:240px;height:240px;border:2px dashed var(--primary);border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:900;margin-top:20px;">
        QR SCANNER
      </div>

      <p style="color:var(--muted);margin-top:15px;">
        QR scan hone ke baad payment details automatic detect hongi.
      </p>

      <button class="btn btn-primary" onclick="scanQR()">Start Scan</button>
      <h2 id="result" style="margin-top:18px;color:var(--primary-dark);"></h2>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function scanQR(){
  document.getElementById("result").innerText = "QR scanned successfully ✅";
}
</script>
</body>
</html>

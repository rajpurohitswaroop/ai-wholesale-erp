<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Payment Detect</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Auto Detect</div>
    <div class="menu">
      <a href="qr-scanner.html">🔳 QR Scanner</a>
      <a class="active">🤖 Auto Payment Detect</a>
      <a href="qr-verification-system.html">🛡 QR Verification</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Auto Payment Detect</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Detected</h3><h2>₹6,670</h2></div>
      <div class="card stat"><h3>Mode</h3><h2>UPI</h2></div>
      <div class="card stat"><h3>Status</h3><h2>Success</h2></div>
      <div class="card stat"><h3>Bill</h3><h2>#1001</h2></div>
    </div>

    <div class="card">
      <h2>Detected Payment Details</h2>
      <p style="color:var(--muted);line-height:1.8;margin-top:10px;">
        Customer payment QR / UPI transaction detect hone ke baad system automatic bill match karega.
      </p>

      <br>
      <button class="btn btn-primary" onclick="alert('Payment auto detected ✅')">Detect Payment</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Confirmation</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Confirmation</div>
    <div class="menu">
      <a href="auto-payment-detect.html">🤖 Auto Detect</a>
      <a class="active">✅ Confirmation</a>
      <a href="auto-bill-paid-update.html">🧾 Bill Update</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Payment Confirmation</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Confirm Payment</h2>

      <div class="form-group">
        <label>Bill Number</label>
        <input id="billNo" value="#1001">
      </div>

      <div class="form-group">
        <label>Payment Amount</label>
        <input id="amount" type="number" value="6670">
      </div>

      <div class="form-group">
        <label>Transaction ID</label>
        <input id="txn" value="UPI123456789">
      </div>

      <button class="btn btn-primary" onclick="confirmPayment()">Confirm Payment</button>
      <p id="msg" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function confirmPayment(){
  document.getElementById("msg").innerText = "Payment confirmed successfully ✅";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Stock Updates</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Bulk Stock</div>
    <div class="menu">
      <a href="bulk-product-upload.html">📦 Product Upload</a>
      <a href="unlimited-product-support.html">♾ Unlimited Support</a>
      <a class="active">📊 Bulk Stock Updates</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Bulk Stock Updates</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Upload Stock Update File</h2>
      <div class="form-group">
        <label>Excel / CSV Stock File</label>
        <input type="file" accept=".xlsx,.xls,.csv">
      </div>

      <div class="form-group">
        <label>Update Type</label>
        <select>
          <option>Add Stock</option>
          <option>Replace Stock</option>
          <option>Reduce Stock</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Bulk stock updated successfully ✅')">Update Bulk Stock</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

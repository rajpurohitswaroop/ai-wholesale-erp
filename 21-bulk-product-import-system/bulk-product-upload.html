<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Product Upload</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Bulk Import</div>
    <div class="menu">
      <a class="active">📦 Bulk Upload</a>
      <a href="excel-import.html">📊 Excel Import</a>
      <a href="csv-import.html">📄 CSV Import</a>
      <a href="import-history.html">📜 Import History</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Bulk Product Upload</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Upload Product File</h2>
      <div class="form-group">
        <label>Select Excel / CSV File</label>
        <input id="fileUpload" type="file" accept=".xlsx,.xls,.csv">
      </div>

      <button class="btn btn-primary" onclick="uploadProducts()">Upload Products</button>
      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function uploadProducts(){
  const file = document.getElementById("fileUpload").files[0];
  if(!file){
    alert("Excel ya CSV file select karo");
    return;
  }
  document.getElementById("result").innerText = file.name + " uploaded successfully ✅";
}
</script>
</body>
</html>

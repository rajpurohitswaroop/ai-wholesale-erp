<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Auto Create</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Auto Create</div>
    <div class="menu">
      <a href="duplicate-detection.html">🔍 Duplicate Check</a>
      <a class="active">⚙ Product Auto Create</a>
      <a href="bulk-stock-updates.html">📊 Bulk Stock</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Product Auto Create</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>New Products</h3><h2>128</h2></div>
      <div class="card stat"><h3>Duplicates</h3><h2>6</h2></div>
      <div class="card stat"><h3>Auto Created</h3><h2>122</h2></div>
      <div class="card stat"><h3>Failed</h3><h2>0</h2></div>
    </div>

    <div class="card">
      <h2>Auto Create Rule</h2>
      <p style="color:var(--muted);line-height:1.8;">Excel/CSV upload ke baad system product name, rate, GST, stock aur SKU ke base par products auto create karega.</p>
      <br>
      <button class="btn btn-primary" onclick="alert('Products auto created ✅')">Run Auto Create</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

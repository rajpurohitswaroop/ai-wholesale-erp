<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Language Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/language.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Language ERP</div>
    <div class="menu">
      <a class="active">🌐 Dashboard</a>
      <a href="dynamic-language-switcher.html">🔄 Language Switcher</a>
      <a href="multi-language-whatsapp-ai.html">📲 WhatsApp AI</a>
      <a href="multi-language-voice-ai.html">🎙 Voice AI</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Multi-Language AI ERP System</h1>
      <select id="languageSelect" onchange="changeLanguage()">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Gujarati">Gujarati</option>
        <option value="Marathi">Marathi</option>
        <option value="Tamil">Tamil</option>
        <option value="Telugu">Telugu</option>
        <option value="Kannada">Kannada</option>
        <option value="Bengali">Bengali</option>
        <option value="Punjabi">Punjabi</option>
        <option value="Malayalam">Malayalam</option>
      </select>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Dashboard</h3><h2 id="dashText">English</h2></div>
      <div class="card stat"><h3>WhatsApp AI</h3><h2>Multi-Language</h2></div>
      <div class="card stat"><h3>Voice AI</h3><h2>Regional</h2></div>
      <div class="card stat"><h3>Billing</h3><h2>Language Ready</h2></div>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/language.js"></script>
<script>
function changeLanguage(){
  const lang = document.getElementById("languageSelect").value;
  document.getElementById("dashText").innerText = lang;
  alert("Language changed to " + lang + " ✅");
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Products</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">➕ Add Product</a>
      <a href="product-list.html">📦 Product List</a>
      <a href="stock-update.html">📊 Stock Update</a>
      <a href="bulk-upload.html">📥 Bulk Upload</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Add Product</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Product Name</label>
        <input id="productName" type="text" placeholder="Example: Sugar 50kg">
      </div>

      <div class="form-group">
        <label>Stock Quantity</label>
        <input id="productStock" type="number" placeholder="Example: 100">
      </div>

      <div class="form-group">
        <label>Rate</label>
        <input id="productRate" type="number" placeholder="Example: 42">
      </div>

      <div class="form-group">
        <label>GST %</label>
        <input id="productGst" type="number" placeholder="Example: 5">
      </div>

      <button class="btn btn-primary" onclick="saveProductForm()">Save Product</button>
      <a class="btn btn-light" href="product-list.html">View Products</a>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/stock.js"></script>
<script>
function saveProductForm(){
  const name = document.getElementById("productName").value.trim();
  const stock = Number(document.getElementById("productStock").value);
  const rate = Number(document.getElementById("productRate").value);
  const gst = Number(document.getElementById("productGst").value || 0);

  addProduct(name, stock, rate, gst);
  alert("Product added successfully ✅");
  window.location.href = "product-list.html";
}
</script>
</body>
</html>

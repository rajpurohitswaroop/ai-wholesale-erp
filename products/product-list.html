<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/stock.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard(); renderProducts()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Products</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a href="add-product.html">➕ Add Product</a>
      <a class="active">📦 Product List</a>
      <a href="stock-update.html">📊 Stock Update</a>
      <a href="bulk-upload.html">📥 Bulk Upload</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Product List</h1>
      <button class="btn btn-primary" onclick="window.location.href='add-product.html'">Add Product</button>
    </div>

    <div class="card table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Product</th>
            <th>Stock</th>
            <th>Rate</th>
            <th>GST</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="productList"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/stock.js"></script>
</body>
</html>

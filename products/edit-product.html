<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Edit Product</div>
    <div class="menu">
      <a href="product-list.html">📦 Product List</a>
      <a class="active">✏ Edit Product</a>
      <a href="stock-update.html">📊 Stock Update</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Edit Product</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <p style="color:var(--muted);margin-bottom:16px;">Demo edit screen. Backend/database connect hone ke baad product edit live hoga.</p>

      <div class="form-group">
        <label>Product Name</label>
        <input type="text" value="Sugar 50kg">
      </div>

      <div class="form-group">
        <label>Rate</label>
        <input type="number" value="42">
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" value="100">
      </div>

      <button class="btn btn-primary" onclick="alert('Product updated ✅')">Update Product</button>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

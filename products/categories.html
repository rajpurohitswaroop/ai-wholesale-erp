<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Categories</div>
    <div class="menu">
      <a href="product-list.html">📦 Products</a>
      <a class="active">🏷 Categories</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Product Categories</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Grocery</h3><h2>320</h2></div>
      <div class="card stat"><h3>Oil</h3><h2>85</h2></div>
      <div class="card stat"><h3>Rice</h3><h2>120</h2></div>
      <div class="card stat"><h3>Tea</h3><h2>45</h2></div>
    </div>

    <div class="card">
      <h2>Add Category</h2>
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" placeholder="Example: Pulses">
      </div>
      <button class="btn btn-primary" onclick="alert('Category added ✅')">Add Category</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

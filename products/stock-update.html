<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Update | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/stock.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard(); renderProducts()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Stock</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a href="product-list.html">📦 Product List</a>
      <a class="active">📊 Stock Update</a>
      <a href="../07-live-stock-management/low-stock-alerts.html">⚠ Low Stock</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Stock Update</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Product Index Number</label>
        <input id="stockIndex" type="number" placeholder="Example: 1">
      </div>

      <div class="form-group">
        <label>Add Quantity</label>
        <input id="stockQty" type="number" placeholder="Example: 50">
      </div>

      <button class="btn btn-primary" onclick="updateStockForm()">Update Stock</button>
    </div>

    <br>

    <div class="card table-card">
      <h2>Current Stock</h2>
      <table>
        <thead><tr><th>#</th><th>Product</th><th>Stock</th><th>Rate</th><th>GST</th><th>Status</th></tr></thead>
        <tbody id="productList"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/stock.js"></script>
<script>
function updateStockForm(){
  const index = Number(document.getElementById("stockIndex").value) - 1;
  const qty = Number(document.getElementById("stockQty").value);
  updateStock(index, qty);
  alert("Stock updated ✅");
}
</script>
</body>
</html>

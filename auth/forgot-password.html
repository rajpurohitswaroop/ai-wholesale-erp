<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AI Wholesale ERP</title>

  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="auth-body">

  <main class="auth-box fade-in">
    <div class="auth-logo">AI Wholesale ERP</div>

    <h2>Forgot Password</h2>
    <p>Registered mobile number ya email enter karein.</p>

    <div class="form-group">
      <label>Email / Mobile</label>
      <input id="recoveryInput" type="text" placeholder="Enter email or mobile">
    </div>

    <button class="btn btn-primary full-btn" onclick="sendOtp()">
      Send OTP
    </button>

    <div class="auth-footer">
      <a href="owner-login.html">Back to Owner Login</a>
    </div>
  </main>

  <script>
    function sendOtp() {
      const value = document.getElementById("recoveryInput").value.trim();

      if (!value) {
        alert("Email ya mobile enter karo");
        return;
      }

      alert("OTP system backend connect hone ke baad active hoga ✅");
    }
  </script>

</body>
</html>

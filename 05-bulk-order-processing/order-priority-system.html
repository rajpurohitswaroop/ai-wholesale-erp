<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Priority System</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Priority</div>
    <div class="menu">
      <a href="order-queue-system.html">📋 Queue</a>
      <a class="active">🔥 Priority</a>
      <a href="fast-order-processing.html">⚡ Processing</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Order Priority System</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Set Order Priority</h2>

      <div class="form-group">
        <label>Order Number</label>
        <input placeholder="Example: #1001">
      </div>

      <div class="form-group">
        <label>Priority</label>
        <select>
          <option>Normal</option>
          <option>High</option>
          <option>Urgent</option>
          <option>VIP Customer</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Order priority updated ✅')">Save Priority</button>
    </div>

    <br>

    <div class="card table-card">
      <h2>Priority Orders</h2>
      <table>
        <tr><th>Order</th><th>Customer</th><th>Priority</th></tr>
        <tr><td>#1001</td><td>Ram Kirana</td><td><span class="status danger">Urgent</span></td></tr>
        <tr><td>#1004</td><td>VIP Mart</td><td><span class="status pending">VIP</span></td></tr>
      </table>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

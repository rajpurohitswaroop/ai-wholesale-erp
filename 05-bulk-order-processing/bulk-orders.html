<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Orders</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Bulk Orders</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">📦 Bulk Orders</a>
      <a href="fast-order-processing.html">⚡ Fast Processing</a>
      <a href="order-queue-system.html">📋 Order Queue</a>
      <a href="dispatch-system.html">🚚 Dispatch</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Bulk Orders</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Create Bulk Order</h2>

      <div class="form-group">
        <label>Customer Name</label>
        <input id="customerName" placeholder="Example: Ram Kirana">
      </div>

      <div class="form-group">
        <label>Order Items</label>
        <textarea id="orderItems" rows="6" placeholder="Example:
10 Sugar
5 Oil Tin
20 Rice Bag"></textarea>
      </div>

      <button class="btn btn-primary" onclick="saveBulkOrder()">Save Bulk Order</button>

      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveBulkOrder(){
  const customer = document.getElementById("customerName").value.trim();
  const items = document.getElementById("orderItems").value.trim();

  if(!customer || !items){
    alert("Customer name aur order items fill karo");
    return;
  }

  document.getElementById("result").innerText = "Bulk order saved successfully ✅";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Item Billing</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/billing.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Multi Billing</div>
    <div class="menu">
      <a href="bulk-orders.html">📦 Bulk Orders</a>
      <a class="active">🧾 Multiple Item Billing</a>
      <a href="../02-auto-billing-system/auto-bill-generation.html">💰 Auto Billing</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Multiple Item Billing</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="billing-layout">
      <div class="card">
        <h2>Add Items</h2>

        <div class="form-group">
          <label>Product</label>
          <input id="itemName" placeholder="Example: Sugar">
        </div>

        <div class="form-group">
          <label>Qty</label>
          <input id="itemQty" type="number" placeholder="Example: 10">
        </div>

        <div class="form-group">
          <label>Rate</label>
          <input id="itemRate" type="number" placeholder="Example: 42">
        </div>

        <button class="btn btn-primary" onclick="addMultiItem()">Add Item</button>

        <br><br>

        <table>
          <thead>
            <tr><th>#</th><th>Product</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr>
          </thead>
          <tbody id="billItems"></tbody>
        </table>
      </div>

      <div class="card bill-summary">
        <h2>Summary</h2>
        <div class="summary-total" id="billTotal">₹0.00</div>
        <button class="btn btn-primary full-btn" onclick="alert('Multiple item bill generated ✅')">Generate Bill</button>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/billing.js"></script>
<script>
function addMultiItem(){
  const name = document.getElementById("itemName").value.trim();
  const qty = Number(document.getElementById("itemQty").value);
  const rate = Number(document.getElementById("itemRate").value);
  addBillItem(name, qty, rate, 5);
}
</script>
</body>
</html>

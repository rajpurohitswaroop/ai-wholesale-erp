<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Payment Update</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Auto Update</div>
    <div class="menu">
      <a href="customer-khata.html">📒 Khata</a>
      <a class="active">✅ Auto Payment Update</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Auto Payment Update</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Payment Received</h2>
      <div class="form-group">
        <label>Customer</label>
        <input id="customer" placeholder="Example: Ram Kirana">
      </div>
      <div class="form-group">
        <label>Received Amount</label>
        <input id="received" type="number" placeholder="Example: 5000">
      </div>
      <button class="btn btn-primary" onclick="updatePayment()">Update Khata</button>
      <p id="result" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function updatePayment(){
  document.getElementById("result").innerText = "Payment updated in khata successfully ✅";
}
</script>
</body>
</html>

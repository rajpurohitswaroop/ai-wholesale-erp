<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Khata</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Smart Khata</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">📒 Customer Khata</a>
      <a href="pending-payments.html">⏳ Pending Payments</a>
      <a href="payment-history.html">💳 Payment History</a>
      <a href="khata-summary.html">📊 Khata Summary</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Customer Khata</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Add Khata Entry</h2>

      <div class="form-group">
        <label>Customer Name</label>
        <input id="customerName" placeholder="Example: Ram Kirana">
      </div>

      <div class="form-group">
        <label>Pending Amount</label>
        <input id="amount" type="number" placeholder="Example: 12500">
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input id="dueDate" type="date">
      </div>

      <button class="btn btn-primary" onclick="saveKhata()">Save Khata</button>
      <p id="msg" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveKhata(){
  const name = document.getElementById("customerName").value.trim();
  const amount = document.getElementById("amount").value;
  const due = document.getElementById("dueDate").value;

  if(!name || !amount || !due){
    alert("Customer, amount aur due date fill karo");
    return;
  }

  document.getElementById("msg").innerText = "Khata entry saved successfully ✅";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard | AI Wholesale ERP</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/reports.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body onload="loadDashboard(); loadChartDemo(); showAISuggestion('stock')">

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Analytics</div>
    <div class="menu">
      <a href="owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">📊 Analytics</a>
      <a>📈 Sales</a>
      <a>📦 Stock</a>
      <a>👥 Customers</a>
      <a>💰 Profit</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Business Analytics</h1>
        <p style="color:var(--muted);margin-top:4px;">AI based business insights</p>
      </div>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="report-summary">
      <div class="card stat"><h3>Top Customer</h3><h2>Ram</h2></div>
      <div class="card stat"><h3>Best Product</h3><h2>Sugar</h2></div>
      <div class="card stat"><h3>Monthly Profit</h3><h2>₹88,000</h2></div>
      <div class="card stat"><h3>Late Payments</h3><h2>9</h2></div>
    </div>

    <div class="card">
      <h2>Sales Chart</h2>
      <div id="chartBox" class="chart-box">Loading chart...</div>
    </div>

    <br>

    <div class="card">
      <h2>AI Suggestion</h2>
      <p id="aiSuggestion" style="color:var(--muted);margin-top:10px;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script src="../../assets/js/charts.js"></script>
<script src="../../assets/js/ai.js"></script>
</body>
</html>

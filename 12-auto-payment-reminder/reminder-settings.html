<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder Settings</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Settings</div>
    <div class="menu">
      <a href="whatsapp-reminders.html">📲 WhatsApp</a>
      <a href="reminder-history.html">📜 History</a>
      <a class="active">⚙ Reminder Settings</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Reminder Settings</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Auto Reminder</label>
        <select>
          <option>Enabled</option>
          <option>Disabled</option>
        </select>
      </div>

      <div class="form-group">
        <label>Default Reminder Message</label>
        <textarea rows="5">Namaste, aapka payment due hai. Kripya payment clear karein.</textarea>
      </div>

      <div class="form-group">
        <label>Reminder Frequency</label>
        <select>
          <option>Daily</option>
          <option>Every 2 Days</option>
          <option>Weekly</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Reminder settings saved ✅')">Save Settings</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

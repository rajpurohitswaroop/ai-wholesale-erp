<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Due Payment Alerts</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Due Alerts</div>
    <div class="menu">
      <a href="auto-reminder-system.html">🤖 Auto Reminder</a>
      <a class="active">🚨 Due Payment Alerts</a>
      <a href="../03-smart-khata-system/pending-payments.html">📒 Pending</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Due Payment Alerts</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Due Today</h3><h2>₹18,500</h2></div>
      <div class="card stat"><h3>Overdue</h3><h2>₹42,000</h2></div>
      <div class="card stat"><h3>Customers</h3><h2>12</h2></div>
      <div class="card stat"><h3>Sent Alerts</h3><h2>28</h2></div>
    </div>

    <div class="card">
      <h2>Alert Message</h2>
      <p style="color:var(--muted);line-height:1.8;margin-top:10px;">
        Due date आने पर customer को WhatsApp पर automatic payment reminder जाएगा.
      </p>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

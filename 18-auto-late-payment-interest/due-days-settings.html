<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Due Days Settings</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Due Settings</div>
    <div class="menu">
      <a href="interest-calculation.html">🧮 Interest</a>
      <a class="active">📅 Due Days Settings</a>
      <a href="interest-on-off-option.html">⚙ ON/OFF</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Due Days Settings</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Interest Start After</label>
        <select id="days">
          <option>7 Days</option>
          <option>10 Days</option>
          <option>15 Days</option>
          <option>30 Days</option>
        </select>
      </div>

      <div class="form-group">
        <label>Grace Period</label>
        <select>
          <option>No Grace</option>
          <option>1 Day Grace</option>
          <option>2 Days Grace</option>
          <option>3 Days Grace</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="alert('Due days settings saved ✅')">Save Settings</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>

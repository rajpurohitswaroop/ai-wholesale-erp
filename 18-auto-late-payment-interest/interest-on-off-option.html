<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest ON OFF Option</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Interest Control</div>
    <div class="menu">
      <a href="interest-calculation.html">🧮 Calculation</a>
      <a class="active">⚙ Interest ON/OFF</a>
      <a href="auto-interest-calculation.html">🤖 Auto Interest</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Interest ON / OFF Option</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Late Payment Interest</label>
        <select id="interestStatus">
          <option>Enabled</option>
          <option>Disabled</option>
        </select>
      </div>

      <div class="form-group">
        <label>Default Interest Rate %</label>
        <input type="number" placeholder="Example: 2">
      </div>

      <button class="btn btn-primary" onclick="saveInterestStatus()">Save Option</button>
      <p id="msg" style="margin-top:15px;color:var(--primary-dark);font-weight:800;"></p>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function saveInterestStatus(){
  const status = document.getElementById("interestStatus").value;
  document.getElementById("msg").innerText = "Interest option saved: " + status + " ✅";
}
</script>
</body>
</html>

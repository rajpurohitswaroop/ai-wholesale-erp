<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest Calculation</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Late Interest</div>
    <div class="menu">
      <a href="../dashboard/owner-dashboard.html">🏠 Dashboard</a>
      <a class="active">🧮 Interest Calculation</a>
      <a href="due-days-settings.html">📅 Due Days Settings</a>
      <a href="interest-on-off-option.html">⚙ Interest ON/OFF</a>
      <a href="late-payment-tracking.html">⏳ Late Tracking</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Interest Calculation</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Calculate Late Payment Interest</h2>

      <div class="form-group">
        <label>Pending Amount</label>
        <input id="amount" type="number" placeholder="Example: 10000">
      </div>

      <div class="form-group">
        <label>Late Days</label>
        <input id="days" type="number" placeholder="Example: 10">
      </div>

      <div class="form-group">
        <label>Interest % Per Month</label>
        <input id="rate" type="number" placeholder="Example: 2">
      </div>

      <button class="btn btn-primary" onclick="calculateInterest()">Calculate Interest</button>

      <h2 id="result" style="margin-top:18px;color:var(--primary-dark);"></h2>
    </div>
  </main>
</div>

<script src="../../assets/js/dashboard.js"></script>
<script>
function calculateInterest(){
  const amount = Number(document.getElementById("amount").value);
  const days = Number(document.getElementById("days").value);
  const rate = Number(document.getElementById("rate").value);

  if(!amount || !days || !rate){
    alert("Amount, days aur rate fill karo");
    return;
  }

  const interest = (amount * rate * days) / (30 * 100);
  document.getElementById("result").innerText = "Late Interest: ₹" + interest.toFixed(2);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Interest Calculation</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body onload="loadDashboard()">
<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">Auto Interest</div>
    <div class="menu">
      <a href="interest-calculation.html">🧮 Manual Calculation</a>
      <a href="interest-on-off-option.html">⚙ ON/OFF</a>
      <a class="active">🤖 Auto Interest</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Auto Interest Calculation</h1>
      <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat"><h3>Interest Status</h3><h2>ON</h2></div>
      <div class="card stat"><h3>Default Rate</h3><h2>2%</h2></div>
      <div class="card stat"><h3>Late Customers</h3><h2>12</h2></div>
      <div class="card stat"><h3>Total Interest</h3><h2>₹8,450</h2></div>
    </div>

    <div class="card">
      <h2>Auto Rule</h2>
      <p style="color:var(--muted);line-height:1.8;margin-top:10px;">
        Due date cross hone ke baad system automatic interest calculate karega aur customer khata me add karega.
      </p>

      <br>
      <button class="btn btn-primary" onclick="alert('Auto interest calculation checked ✅')">Run Auto Check</button>
    </div>
  </main>
</div>
<script src="../../assets/js/dashboard.js"></script>
</body>
</html>
